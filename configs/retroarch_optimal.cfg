# RetroArch Optimal Configuration for Tinker Board
# Copy this to /storage/.config/retroarch/retroarch.cfg
# Or use as reference for manual configuration

# Video Settings
video_driver = "gl"
video_threaded = "true"
video_vsync = "true"
video_hard_sync = "false"
video_hard_sync_frames = "0"
video_frame_delay = "0"
video_max_swapchain_images = "2"
video_smooth = "false"
video_force_aspect = "true"
video_aspect_ratio_auto = "true"
video_fullscreen = "true"

# Audio Settings
audio_driver = "alsathread"
audio_enable = "true"
audio_latency = "64"
audio_sync = "true"
audio_max_timing_skew = "0.05"

# Input Settings
input_autodetect_enable = "true"
input_joypad_driver = "udev"
input_max_users = "4"

# Hotkeys (Select + Button for most actions)
input_enable_hotkey = "select"
input_exit_emulator = "start"
input_save_state = "r"
input_load_state = "l"
input_state_slot_increase = "right"
input_state_slot_decrease = "left"
input_menu_toggle = "x"
input_screenshot = "f8"
input_fps_toggle = "f3"

# Performance Settings
rewind_enable = "false"
savestate_auto_save = "true"
savestate_auto_load = "true"
run_ahead_enabled = "false"
run_ahead_frames = "1"

# Menu Settings
menu_driver = "xmb"
xmb_theme = "0"
menu_linear_filter = "true"

# Network Settings
network_cmd_enable = "false"
netplay_enable = "false"
netplay_mode = "false"
netplay_client_swap_input = "false"

# Logging
log_verbosity = "false"

# Other
fps_show = "false"
fastforward_ratio = "0.0"
slowmotion_ratio = "3.0"
pause_nonactive = "true"
